# /etc/nginx/sites-available/pyovms
#
# Replace every occurrence of "your.domain.com" with your actual domain before
# copying this file. Optional service blocks are commented out — uncomment the
# ones that match your setup.

# Required for WebSocket proxying
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    server_name your.domain.com;
    return 301 https://$host$request_uri;
}

# ── HTTPS server ───────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name your.domain.com;

    # TLS — certificate paths written by Certbot
    ssl_certificate     /etc/letsencrypt/live/your.domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your.domain.com/privkey.pem;
    include /etc/nginx/snippets/ssl.conf;

    access_log /var/log/nginx/pyovms-access.log;
    error_log  /var/log/nginx/pyovms-error.log;

    # Request bodies. The largest the app sends is a configuration backup
    # (POST /api/v1/config-backups): JSON text of up to 256 K characters — see
    # CONFIG_BACKUP_MAX_PAYLOAD_CHARS — which is up to 1 MiB of UTF-8. Nginx's
    # default is 1m, which would turn such a backup into a 413.
    client_max_body_size 4m;

    # ── Internal auth subrequest (not directly accessible) ──────────────────
    # Used by the Valhalla block below to validate API keys before proxying.
    location = /api/v1/auth/ping {
        internal;
        proxy_pass http://127.0.0.1:8000;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-API-Key $http_x_api_key;
    }

    location @auth_error {
        default_type application/json;
        return 401 '{"error":"Unauthorized"}';
    }

    # ── Valhalla routing (optional) ─────────────────────────────────────────
    # Requires: docker compose up -d valhalla (binds to 127.0.0.1:8002).
    # Every request must carry a valid X-API-Key header.
    #
    # location /route {
    #     auth_request /api/v1/auth/ping;
    #     error_page 401 = @auth_error;
    #     proxy_pass http://127.0.0.1:8002;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # ── Karto trip tracking API (optional) ──────────────────────────────────
    # Requires: ENABLE_KARTO_TRIP_TRACKING=true in .env (runs on port 8001).
    #
    # location /api/karto {
    #     proxy_pass http://127.0.0.1:8001;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection $connection_upgrade;
    # }

    # ── Protomaps tile server (optional) ────────────────────────────────────
    # Serves local .pmtiles files. Range-request headers are required by
    # Protomaps clients for efficient tile delivery.
    #
    # location /maps {
    #     alias /opt/PyOVMS-Karto/maps/;
    #     add_header Accept-Ranges bytes always;
    #     add_header Access-Control-Allow-Origin "*" always;
    #     add_header Cache-Control "no-store" always;
    #     add_header Vary Range always;
    # }

    # ── Main PyOVMS application ──────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # ── Custom error pages ───────────────────────────────────────────────────
    error_page 404 /404.html;
    error_page 429 /429.html;
    error_page 502 /502.html;
    error_page 504 /504.html;

    location ~ ^/(404|429|502|504)\.html$ {
        root /var/www/html;
        internal;
    }
}
