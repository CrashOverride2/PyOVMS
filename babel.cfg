[python: **.py]
[jinja2: app/templates/**.html]
extensions=jinja2.ext.i18n

# The plain-text half of every multipart mail. Without this section the .txt bodies are
# never extracted, so a recipient whose HTML is stripped gets an English message while
# the HTML alternative next to it is translated.
[jinja2: app/templates/**.txt]
extensions=jinja2.ext.i18n
