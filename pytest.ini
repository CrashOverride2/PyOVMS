[pytest]
testpaths = tests
python_files = test_*.py
# -m "not cve" keeps the default run offline and deterministic, which is the property
# conftest.py is built around. A command-line -m overrides this one (addopts are
# prepended), so `pytest -m cve` runs exactly the deselected tests.
addopts = -q --strict-markers -m "not cve"
markers =
    cve: queries the online advisory database; deselected by default, run with `pytest -m cve`
filterwarnings =
    ignore::DeprecationWarning
