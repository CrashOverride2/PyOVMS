{% extends "base.html" %}

{% block title %}{{ _('Charge Details') }}{% endblock %}

{% block scripts %}
{{ super() }}
<script src="{{ url_for('static', path='/js/chart.umd.js') }}"></script>

<script src="{{ url_for('static', path='/js/luxon.min.js') }}"></script>
<script src="{{ url_for('static', path='/js/chartjs-adapter-luxon.umd.min.js') }}"></script>

<script nonce="{{ request.state.csp_nonce }}">
const KM_TO_MI = 0.621371;
const chargeDetailConfig = {
    vehicleId: {{ vehicle.vehicle_id | tojson | safe }},
    chargeLogId: {{ charge_log_id | tojson | safe }},
    userTimezone: {{ user_timezone | tojson | safe }},
    userPrefersImperial: {{ user_prefers_imperial | lower }},
    deleteRedirect: {{ (url_for('ui_vehicle_detail_page', vehicle_module_id=vehicle.vehicle_id) ~ '?tab=charges&success_message=' ~ _('Charge session deleted successfully.')) | tojson | safe }}
};
document.addEventListener('alpine:init', () => {
    Alpine.data('chargeDetailData', () => ({
        vehicleId: chargeDetailConfig.vehicleId,
        chargeLogId: chargeDetailConfig.chargeLogId,
        userTimezone: chargeDetailConfig.userTimezone,
        charge: null, isLoading: true, error: null, chart: null,
        dateTimeFormatter: null,
        showDeleteConfirm: false,
        showError: false,
        hasCharge: false,
        showLocation: false,
        map: null,
        marker: null,
        chargeView: {
            startTimeText: 'N/A',
            endTimeText: 'N/A',
            durationText: 'N/A',
            startSocText: 'N/A',
            endSocText: 'N/A',
            socGainedText: 'N/A',
            energyText: 'N/A',
            maxPowerText: 'N/A',
            averagePowerText: 'N/A',
            odometerText: 'N/A',
            locationText: 'N/A'
        },

        init() {
            try {
                this.dateTimeFormatter = new Intl.DateTimeFormat(undefined, {
                    timeZone: this.userTimezone,
                    dateStyle: 'medium',
                    timeStyle: 'short'
                });
            } catch (e) {
                console.error(`Invalid timezone for formatter: ${this.userTimezone}`, e);
                this.dateTimeFormatter = new Intl.DateTimeFormat(undefined, {
                    dateStyle: 'medium',
                    timeStyle: 'short'
                });
            }

            this.$watch('charge', (val) => {
                if (val) {
                    this.$nextTick(() => {
                        this.initChart();
                        if (this.showLocation) {
                            this.initMap();
                        }
                    });
                }
            });
            this.$watch('showDeleteConfirm', () => this.refreshUiState());
            this.refreshUiState();
            this.fetchChargeDetails();
        },
        refreshUiState() {
            this.showError = !!this.error;
            this.hasCharge = !!this.charge;
            this.showLocation = this.hasLocationData();
        },
        buildChargeView() {
            if (!this.charge) return;
            this.chargeView.startTimeText = this.formatDateTime(this.charge.start_time);
            this.chargeView.endTimeText = this.formatDateTime(this.charge.end_time);
            this.chargeView.durationText = this.formatDuration(this.charge.duration_seconds);
            this.chargeView.startSocText = this.formatSoc(this.charge.start_soc);
            this.chargeView.endSocText = this.formatSoc(this.charge.end_soc);
            const endSoc = Number(this.charge.end_soc);
            const startSoc = Number(this.charge.start_soc);
            this.chargeView.socGainedText = Number.isFinite(endSoc) && Number.isFinite(startSoc)
                ? `+${(endSoc - startSoc).toFixed(1)}%`
                : 'N/A';
            this.chargeView.energyText = this.formatEnergy(this.charge.energy_added_kwh);
            this.chargeView.maxPowerText = this.formatPower(this.charge.max_power_kw);
            this.chargeView.averagePowerText = this.formatPower(this.charge.average_power_kw);
            this.chargeView.odometerText = this.formatOdometer(this.charge.start_odometer);
            this.chargeView.locationText = this.formatLocation(this.charge.start_latitude, this.charge.start_longitude);
        },
        openDeleteConfirm() { this.showDeleteConfirm = true; },
        closeDeleteConfirm() { this.showDeleteConfirm = false; },
        confirmDeleteCharge() {
            this.closeDeleteConfirm();
            this.deleteCharge();
        },

        fetchChargeDetails() {
            this.isLoading = true; this.error = null;
            this.refreshUiState();
            fetch(`/api/chargelogs/v1/charges/${this.chargeLogId}`, { credentials: 'include' })
                .then(res => {
                    if (!res.ok) throw new Error(`{{ _('Failed to load charge details (Status: ') }}${res.status})`);
                    return res.json();
                })
                .then(data => {
                    this.charge = data;
                    this.buildChargeView();
                    this.refreshUiState();
                })
                .catch(err => { this.error = err.message; this.refreshUiState(); console.error(err); })
                .finally(() => { this.isLoading = false; });
        },

        initChart() {
            const canvas = this.$refs.chargeCanvas;
            if (!canvas || !document.body.contains(canvas)) {
                this.$nextTick(() => this.initChart());
                return;
            }

            if (this.chart) {
                this.chart.destroy();
                this.chart = null;
            }

            const ctx = canvas.getContext('2d');
            if (!ctx) {
                console.error("Could not get 2D rendering context from canvas.");
                return;
            }

            const points = Array.isArray(this.charge?.points) ? this.charge.points : [];
            const toMs = (ts) => new Date(ts).valueOf();

            const socData = points.map(p => ({ x: toMs(p.timestamp), y: (p.soc == null ? null : Number(p.soc)) }));
            const powerData = points.map(p => ({ x: toMs(p.timestamp), y: (p.power_kw == null ? null : Number(p.power_kw)) }));
            const hasTemp = points.some(p => p.battery_temp_c !== null && p.battery_temp_c !== undefined);
            const tempData = hasTemp ? points.map(p => ({ x: toMs(p.timestamp), y: (p.battery_temp_c == null ? null : Number(p.battery_temp_c)) })) : [];

            const datasets = [
                {
                    label: '{{ _("SOC (%)") }}', yAxisID: 'ySOC',
                    data: socData, borderColor: '#00c6ff', backgroundColor: '#00c6ff40',
                    tension: 0.1, cubicInterpolationMode: 'monotone', borderWidth: 2, pointRadius: 1, spanGaps: true
                },
                {
                    label: '{{ _("Power (kW)") }}', yAxisID: 'yPower',
                    data: powerData, borderColor: '#39FF14', backgroundColor: '#39FF1440',
                    tension: 0.1, cubicInterpolationMode: 'monotone', borderWidth: 2, pointRadius: 1, spanGaps: true
                }
            ];

            if (hasTemp) {
                datasets.push({
                    label: '{{ _("Battery (°C)") }}', yAxisID: 'yTemp',
                    data: tempData, borderColor: '#ff00ff', backgroundColor: '#ff00ff40',
                    tension: 0.1, cubicInterpolationMode: 'monotone', borderWidth: 2, pointRadius: 1, spanGaps: true
                });
            }

            const userTz = this.userTimezone;
            const dateTimeFormatter = this.dateTimeFormatter;

            const updateTempScaleVisibility = (chart) => {
                const anyTempVisible = chart.data.datasets.some((ds, i) =>
                    ds.yAxisID === 'yTemp' && chart.isDatasetVisible(i)
                );
                chart.options.scales.yTemp.display = hasTemp && anyTempVisible;
            };

            const backgroundColorPlugin = {
                id: 'customCanvasBackgroundColor',
                beforeDraw: (chart, args, options) => {
                    const {ctx} = chart;
                    ctx.save();
                    ctx.globalCompositeOperation = 'destination-over';
                    ctx.fillStyle = options.color || '#161b22';
                    ctx.fillRect(0, 0, chart.width, chart.height);
                    ctx.restore();
                }
            };

            this.chart = new Chart(ctx, {
                type: 'line',
                plugins: [backgroundColorPlugin],
                data: { datasets },
                options: {
                    parsing: false,
                    normalized: true,
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    animation: false,
                    adapters: { date: { zone: userTz } },
                    scales: {
                        x: {
                            type: 'time',
                            time: { unit: 'minute' },
                            grid: { color: '#30363d' },
                            ticks: { color: '#8b949e' }
                        },
                        ySOC: {
                            type: 'linear',
                            position: 'left',
                            min: 0, max: 100,
                            grid: { color: '#30363d' },
                            ticks: { color: '#00c6ff', callback: v => v.toFixed(1) + '%' }
                        },
                        yPower: {
                            type: 'linear',
                            position: 'right',
                            grid: { drawOnChartArea: false },
                            ticks: { color: '#39FF14', callback: v => v.toFixed(1) + ' kW' }
                        },
                        yTemp: {
                            type: 'linear',
                            position: 'right',
                            grid: { drawOnChartArea: false },
                            ticks: { color: '#ff00ff', callback: v => v.toFixed(1) + '°C' },
                            display: hasTemp
                        }
                    },
                    plugins: {
                        customCanvasBackgroundColor: {
                           color: '#161b22',
                        },
                        legend: {
                            labels: { color: '#c9d1d9' },
                            onClick: (e, legendItem, legend) => {
                                const index = legendItem.datasetIndex;
                                const ci = legend.chart;
                                const meta = ci.getDatasetMeta(index);

                                meta.hidden = meta.hidden === null ? !ci.data.datasets[index].hidden : null;

                                updateTempScaleVisibility(ci);
                                ci.update();
                            }
                        },
                        tooltip: {
                            callbacks: {
                                title: (items) => {
                                    if (!items.length) return '';
                                    const ts = items[0].parsed.x;
                                    if (dateTimeFormatter) {
                                        return dateTimeFormatter.format(new Date(ts));
                                    }
                                    return new Date(ts).toLocaleString();
                                },
                                label: (context) => {
                                    let label = context.dataset.label || '';
                                    if (label) {
                                        label += ': ';
                                    }
                                    if (context.parsed.y !== null) {
                                        const value = context.parsed.y.toFixed(2);
                                        if (context.dataset.yAxisID === 'ySOC') {
                                            label += value + '%';
                                        } else if (context.dataset.yAxisID === 'yPower') {
                                            label += value + ' kW';
                                        } else if (context.dataset.yAxisID === 'yTemp') {
                                            label += value + '°C';
                                        } else {
                                            label += value;
                                        }
                                    }
                                    return label;
                                }
                            }
                        }
                    }
                }
            });

            updateTempScaleVisibility(this.chart);
        },

        exportChart() {
            if (!this.chart) {
                alert('{{ _("Chart is not available for export.") }}');
                return;
            }
            const imageUrl = this.chart.toBase64Image();
            const link = document.createElement('a');
            link.href = imageUrl;
            link.download = `charge-log-${this.chargeLogId}-${new Date().toISOString().split('T')[0]}.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        },

        exportLocationGPX() {
            window.location.href = `/api/chargelogs/v1/charges/${this.chargeLogId}/gpx`;
        },

        exportLocationKML() {
            window.location.href = `/api/chargelogs/v1/charges/${this.chargeLogId}/kml`;
        },

        deleteCharge() {
            this.showDeleteConfirm = false;
            fetch(`/api/chargelogs/v1/charges/${this.chargeLogId}`, { method: 'DELETE', credentials: 'include' })
                .then(response => {
                    if (response.ok) {
                        window.location.href = chargeDetailConfig.deleteRedirect;
                    } else {
                        response.json().then(data => alert(`{{ _('Error deleting charge log: ') }}${data.detail || response.statusText}`));
                    }
                })
                .catch(err => alert(`{{ _('Network error: ') }}${err.message}`));
        },

        formatDateTime(isoString) {
            if (!isoString || !this.dateTimeFormatter) return 'N/A';
            return this.dateTimeFormatter.format(new Date(isoString));
        },
        formatDuration(seconds) {
            if (seconds === null || seconds === undefined) return 'N/A';
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            return `${h}h ${m}m`;
        },
        formatSoc(soc) {
            return (soc !== null && soc !== undefined && soc !== '') ? `${Number(soc).toFixed(1)}%` : 'N/A';
        },
        formatEnergy(kwh) {
            return (kwh !== null && kwh !== undefined && kwh !== '') ? `${Number(kwh).toFixed(2)} kWh` : 'N/A';
        },
        formatPower(kw) {
            return (kw !== null && kw !== undefined && kw !== '') ? `${Number(kw).toFixed(2)} kW` : 'N/A';
        },
        formatOdometer(km) {
            if (km === null || km === undefined || km === '') return 'N/A';
            if (chargeDetailConfig.userPrefersImperial) return `${(Number(km) * KM_TO_MI).toFixed(1)} mi`;
            return `${Number(km).toFixed(1)} km`;
        },
        formatLocation(lat, lon) {
            if (lat !== null && lat !== undefined && lon !== null && lon !== undefined) {
                return `${Number(lat).toFixed(6)}, ${Number(lon).toFixed(6)}`;
            }
            return 'N/A';
        },
        hasLocationData() {
            return this.charge?.start_latitude !== null && this.charge?.start_latitude !== undefined &&
                   this.charge?.start_longitude !== null && this.charge?.start_longitude !== undefined;
        },
        initMap() {
            if (!this.hasLocationData()) return;
            if (typeof L === 'undefined') {
                console.error('Leaflet is not loaded');
                return;
            }

            const lat = parseFloat(this.charge.start_latitude);
            const lon = parseFloat(this.charge.start_longitude);

            if (this.map) {
                this.map.remove();
            }

            this.map = L.map('charge-location-map').setView([lat, lon], 15);

            const protomapsUrl = {{ PROTOMAPS_URL | tojson | safe }};

            if (protomapsUrl) {
                if (typeof protomapsL === 'undefined' || (protomapsUrl.endsWith('.pmtiles') && typeof pmtiles === 'undefined')) {
                    console.error('Protomaps scripts not loaded, falling back to OSM');
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap contributors',
                        maxZoom: 19
                    }).addTo(this.map);
                } else {
                    try {
                        const paintRules = [
                            { dataLayer: "water", symbolizer: new protomapsL.PolygonSymbolizer({ fill: "#1e3a8a" }) },
                            { dataLayer: "landuse", symbolizer: new protomapsL.PolygonSymbolizer({ fill: "#161b22" }) },
                            { dataLayer: "natural", symbolizer: new protomapsL.PolygonSymbolizer({ fill: "#161b22" }) },
                            { dataLayer: "transit", symbolizer: new protomapsL.LineSymbolizer({ color: "#374151", width: 1 })},
                            {
                                dataLayer: "roads",
                                symbolizer: new protomapsL.LineSymbolizer({
                                    color: (z,f) => (f.props.highway_kind === "highway" || f.props.highway_kind === "motorway") ? "#6b7280" : "#4b5563",
                                    width: (z,f) => (f.props.highway_kind === "highway" || f.props.highway_kind === "motorway") ? (z > 14 ? 3 : 2) : (z > 14 ? 2 : 1)
                                })
                            },
                            { dataLayer: "buildings", symbolizer: new protomapsL.PolygonSymbolizer({ fill: "#22282f" }) },
                            { dataLayer: "boundaries", symbolizer: new protomapsL.LineSymbolizer({ color: "#39FF14", width: 0.5, opacity: 0.4 }) }
                        ];
                        const labelRules = [
                            {
                                dataLayer: "places",
                                symbolizer: new protomapsL.CenteredTextSymbolizer({
                                    label_props: ["name:{{ user_locale }}","name"],
                                    fill: (z,f) => (f.props.kind === 'country' || f.props.kind === 'region') ? '#FFF01F' : '#c9d1d9',
                                    stroke: "#0d1117",
                                    width: 2,
                                    font: (z,f) => {
                                        if (f.props.kind === 'country') return "bold 14px sans-serif";
                                        if (f.props.kind === 'region') return "bold 12px sans-serif";
                                        return "11px sans-serif";
                                    }
                                })
                            },
                            {
                                dataLayer: "roads",
                                symbolizer: new protomapsL.LineLabelSymbolizer({
                                    label_props: ["name:{{ user_locale }}","name"],
                                    fill: "#8b949e",
                                    stroke: "#0d1117",
                                    width: 2,
                                    font: "10px sans-serif"
                                })
                            }
                        ];
                        let mapUrl = protomapsUrl;
                        if (protomapsUrl.endsWith('.pmtiles') && typeof pmtiles !== 'undefined') {
                            const pmtilesSource = new pmtiles.FetchSource(protomapsUrl, new Headers({'Cache-Control': 'no-cache', 'Pragma': 'no-cache'}));
                            pmtilesSource.chromeWindowsNoCache = true;
                            mapUrl = new pmtiles.PMTiles(pmtilesSource);
                        }
                        protomapsL.leafletLayer({
                            url: mapUrl,
                            paintRules: paintRules,
                            labelRules: labelRules,
                            backgroundColor: "#0d1117"
                        }).addTo(this.map);
                    } catch (e) {
                        console.error('Error initializing Protomaps layer:', e);
                        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                            attribution: '© OpenStreetMap contributors',
                            maxZoom: 19
                        }).addTo(this.map);
                    }
                }
            } else {
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors',
                    maxZoom: 19
                }).addTo(this.map);
            }

            // Add marker for charge location
            this.marker = L.marker([lat, lon]).addTo(this.map)
                .bindPopup('{{ _("Charge Start Location") }}')
                .openPopup();
            const chargeMapEl = document.getElementById('charge-location-map');
            if (this.chargeMapResizeObserver) this.chargeMapResizeObserver.disconnect();
            this.chargeMapResizeObserver = new ResizeObserver(() => { if (this.map) this.map.invalidateSize({ pan: false }); });
            this.chargeMapResizeObserver.observe(chargeMapEl);
            requestAnimationFrame(() => { if (this.map) this.map.invalidateSize({ pan: false }); });
            setTimeout(() => { if (this.map) this.map.invalidateSize({ pan: false }); }, 500);
        }
    }));
});
</script>
{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto" x-data="chargeDetailData">
    <div class="flex justify-start mb-6">
        <a href="{{ url_for('ui_vehicle_detail_page', vehicle_module_id=vehicle.vehicle_id) }}?tab=charges" class="px-4 py-2 text-sm font-medium text-neon-blue border border-neon-blue rounded-md hover:bg-neon-blue hover:text-dark-bg transition-colors duration-200">← {{ _('Back to All Charges') }}</a>
    </div>

    <div x-show="isLoading" class="text-center py-10 text-text-secondary">{{ _('Loading charge details...') }}</div>
    <div x-show="showError" class="p-4 text-center text-red-400 bg-red-900/40 border border-red-700/60 rounded-md">
        <p x-text="error"></p>
    </div>

    <template x-if="hasCharge">
        <div x-cloak>
            <div class="bg-card-bg p-6 rounded-lg shadow-xl border border-neon-blue/50">
                <h1 class="text-2xl md:text-3xl font-bold mb-4 text-neon-blue">{{ _('Charge Session') }}</h1>
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2 space-y-6">
                        <div class="h-[500px] bg-input-bg p-4 rounded-md border border-border-color shadow-md">
                            <canvas x-ref="chargeCanvas"></canvas>
                        </div>
                        <div x-show="showLocation" class="h-[300px] bg-input-bg rounded-md border border-border-color shadow-md overflow-hidden">
                            <div id="charge-location-map" class="w-full h-full"></div>
                        </div>
                    </div>
                    <div class="bg-input-bg p-5 rounded-md border border-border-color shadow-md">
                        <h2 class="text-xl font-semibold text-neon-yellow mb-3">{{ _('Summary') }}</h2>
                        <dl class="text-sm space-y-2">
                            <div class="flex justify-between">
                                <dt class="text-text-secondary">{{ _('Start Time') }}</dt>
                                <dd class="text-text-primary text-right" x-text="chargeView.startTimeText"></dd>
                            </div>
                            <div class="flex justify-between">
                                <dt class="text-text-secondary">{{ _('End Time') }}</dt>
                                <dd class="text-text-primary text-right" x-text="chargeView.endTimeText"></dd>
                            </div>
                            <div class="flex justify-between">
                                <dt class="text-text-secondary">{{ _('Duration') }}</dt>
                                <dd class="text-text-primary font-medium" x-text="chargeView.durationText"></dd>
                            </div>

                            <div class="flex justify-between pt-2 border-t border-border-color/30">
                                <dt class="text-text-secondary">{{ _('Start SOC') }}</dt>
                                <dd class="text-text-primary font-medium" x-text="chargeView.startSocText"></dd>
                            </div>
                            <div class="flex justify-between">
                                <dt class="text-text-secondary">{{ _('End SOC') }}</dt>
                                <dd class="text-text-primary font-medium" x-text="chargeView.endSocText"></dd>
                            </div>
                            <div class="flex justify-between">
                                <dt class="text-text-secondary">{{ _('SOC Gained') }}</dt>
                                <dd class="font-medium text-green-400"
                                    x-text="chargeView.socGainedText">
                                </dd>
                            </div>

                            <div class="flex justify-between pt-2 border-t border-border-color/30">
                                <dt class="text-text-secondary">{{ _('Energy Charged') }}</dt>
                                <dd class="text-text-primary font-medium" x-text="chargeView.energyText"></dd>
                            </div>
                            <div class="flex justify-between">
                                <dt class="text-text-secondary">{{ _('Max Power') }}</dt>
                                <dd class="text-text-primary font-medium" x-text="chargeView.maxPowerText"></dd>
                            </div>
                             <div class="flex justify-between">
                                <dt class="text-text-secondary">{{ _('Avg. Power') }}</dt>
                                <dd class="text-text-primary font-medium" x-text="chargeView.averagePowerText"></dd>
                            </div>

                            <div class="flex justify-between pt-2 border-t border-border-color/30">
                                <dt class="text-text-secondary">{{ _('Start Odometer') }}</dt>
                                <dd class="text-text-primary font-medium" x-text="chargeView.odometerText"></dd>
                            </div>
                            <div class="flex justify-between" x-show="showLocation">
                                <dt class="text-text-secondary">{{ _('Start Location') }}</dt>
                                <dd class="text-text-primary text-right font-medium" x-text="chargeView.locationText"></dd>
                            </div>
                        </dl>
                        <div class="mt-6 pt-4 border-t border-border-color/30 space-y-3">
                            <button @click="exportChart" class="w-full px-4 py-2 text-sm font-medium text-neon-green border border-neon-green rounded-md hover:bg-neon-green hover:text-dark-bg transition-colors">
                                {{ _('Export Chart (PNG)') }}
                            </button>
                            <button x-show="showLocation" @click="exportLocationGPX" class="w-full px-4 py-2 text-sm font-medium text-neon-blue border border-neon-blue rounded-md hover:bg-neon-blue hover:text-dark-bg transition-colors">
                                {{ _('Export Location (GPX)') }}
                            </button>
                            <button x-show="showLocation" @click="exportLocationKML" class="w-full px-4 py-2 text-sm font-medium text-neon-yellow border border-neon-yellow rounded-md hover:bg-neon-yellow hover:text-dark-bg transition-colors">
                                {{ _('Export Location (KML)') }}
                            </button>
                             <button @click="openDeleteConfirm" class="w-full px-4 py-2 text-sm font-medium text-red-500 border border-red-500 rounded-md hover:bg-red-500 hover:text-white transition-colors">
                                {{ _('Delete This Charge Session') }}
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template x-teleport="body">
        <div x-show="showDeleteConfirm" x-cloak
             class="fixed inset-0 z- flex items-center justify-center bg-black bg-opacity-75 backdrop-blur-sm"
             x-transition:enter="ease-out duration-300"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             x-transition:leave="ease-in duration-200"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0">
            <div @click.away="closeDeleteConfirm"
                 class="relative z- bg-card-bg rounded-lg shadow-xl border border-red-500/50 p-6 w-full max-w-md mx-4"
                 x-transition:enter="ease-out duration-300"
                 x-transition:enter-start="opacity-0 scale-95"
                 x-transition:enter-end="opacity-100 scale-100"
                 x-transition:leave="ease-in duration-200"
                 x-transition:leave-start="opacity-100 scale-100"
                 x-transition:leave-end="opacity-0 scale-95">
                
                <h3 class="text-xl font-bold text-red-400 mb-4">{{ _('Confirm Deletion') }}</h3>
                <p class="text-text-primary mb-6">{{ _('Are you sure you want to permanently delete this charge session? This action cannot be undone.') }}</p>
                
                <div class="flex justify-end space-x-4">
                    <button @click="closeDeleteConfirm" class="px-4 py-2 text-sm font-medium text-text-secondary border border-border-color rounded-md hover:bg-border-color hover:text-text-primary transition-colors">
                        {{ _('Cancel') }}
                    </button>
                    <button @click="confirmDeleteCharge" class="px-4 py-2 text-sm font-medium text-dark-bg bg-red-600 border border-red-500 rounded-md hover:bg-red-700 transition-colors">
                        {{ _('Yes, Delete Charge') }}
                    </button>
                </div>
            </div>
        </div>
    </template>
</div>
{% endblock %}
