{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-12">
  <div class="bg-card-bg border border-border-color rounded-lg p-6 shadow">
    <h1 class="text-xl font-semibold text-text-primary mb-2">{{ _('Confirm your password') }}</h1>
    <p class="text-sm text-text-secondary mb-6">
      {{ _('This change affects how your account can be signed into, so please confirm your password before continuing.') }}
    </p>

    {% if error_message %}
    <div class="mb-4 p-3 rounded-md bg-red-900/40 border border-red-700 text-sm text-red-200">
      {{ error_message }}
    </div>
    {% endif %}

    <form action="{{ url_for('ui_confirm_password_submit') }}" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next_url" value="{{ next_url }}">

      <label for="password" class="block text-sm font-medium text-text-secondary">{{ _('Password') }}</label>
      <input type="password" name="password" id="password" required autofocus autocomplete="current-password"
             class="mt-1 block w-full rounded-md bg-input-bg border-border-color text-text-primary shadow-sm focus:border-accent focus:ring-accent">

      <div class="mt-6 flex items-center gap-3">
        <button type="submit"
                class="px-4 py-2 rounded-md bg-accent text-white text-sm font-medium hover:bg-accent-hover">
          {{ _('Confirm') }}
        </button>
        <a href="{{ url_for('ui_profile_page') }}"
           class="px-4 py-2 rounded-md border border-border-color text-sm text-text-secondary hover:text-text-primary">
          {{ _('Cancel') }}
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
