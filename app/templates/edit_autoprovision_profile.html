{% extends "base.html" %}

{% block title %}{{ _(page_title) }}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-card-bg p-6 md:p-8 rounded-lg shadow-xl border border-purple-500/50">
    <div class="flex justify-start mb-6">
        <a href="{{ url_for('ui_manage_autoprovision_profiles') }}" class="px-4 py-2 text-sm font-medium text-neon-blue border border-neon-blue rounded-md hover:bg-neon-blue hover:text-dark-bg transition-colors duration-200">← {{ _('Back to Profiles') }}</a>
    </div>
    <h1 class="text-2xl md:text-3xl font-bold mb-8 text-center text-purple-400">{{ _(page_title) }}</h1>

    <form action="{{ form_action_url }}" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="space-y-5">
            <div>
                <label for="ap_key" class="block text-sm font-medium text-text-secondary">{{ _('Provisioning Key (Shared Secret)') }}</label>
                <input type="text" name="ap_key" id="ap_key" required
                       value="{{ profile_to_edit.ap_key if profile_to_edit else '' }}"
                       class="mt-1 block w-full px-3 py-2 bg-input-bg border-border-color text-text-primary rounded-md shadow-sm focus:border-purple-500 focus:ring-1 focus:ring-purple-500 sm:text-sm"
                       placeholder="{{ _('A strong, unique key for the module') }}">
            </div>

            <div>
                <label for="target_vehicle_id" class="block text-sm font-medium text-text-secondary">{{ _('Target Vehicle ID') }}</label>
                <input type="text" name="target_vehicle_id" id="target_vehicle_id" required
                       value="{{ profile_to_edit.target_vehicle_id_str if profile_to_edit else '' }}"
                       class="mt-1 block w-full px-3 py-2 bg-input-bg border-border-color text-text-primary rounded-md shadow-sm focus:border-purple-500 focus:ring-1 focus:ring-purple-500 sm:text-sm"
                       placeholder="{{ _('The Vehicle ID to create/update (e.g., MYCAR)') }}">
            </div>

            <div>
                <label for="target_server_password" class="block text-sm font-medium text-text-secondary">{{ _('Target Server Password') }}</label>
                <input type="password" name="target_server_password" id="target_server_password" required
                       value="{{ server_pw_display if profile_to_edit else '' }}"
                       class="mt-1 block w-full px-3 py-2 bg-input-bg border-border-color text-text-primary rounded-md shadow-sm focus:border-purple-500 focus:ring-1 focus:ring-purple-500 sm:text-sm"
                       placeholder="{{ _('The password the vehicle will use') }}">
            </div>

            <hr class="border-border-color/30">
            <h2 class="text-lg font-semibold text-text-primary pt-2">{{ _('Optional Overrides') }}</h2>

            <div>
                <label for="target_vehicle_name" class="block text-sm font-medium text-text-secondary">{{ _('Target Vehicle Name (Display Name)') }}</label>
                <input type="text" name="target_vehicle_name" id="target_vehicle_name"
                       value="{{ profile_to_edit.target_vehicle_name if profile_to_edit and profile_to_edit.target_vehicle_name else '' }}"
                       class="mt-1 block w-full px-3 py-2 bg-input-bg border-border-color text-text-primary rounded-md shadow-sm focus:border-purple-500 focus:ring-1 focus:ring-purple-500 sm:text-sm"
                       placeholder="{{ _('e.g., My Provisioned Car') }}">
            </div>

            <div>
                <label for="target_module_password" class="block text-sm font-medium text-text-secondary">{{ _('Target Module Password (Paranoid Mode)') }}</label>
                <input type="password" name="target_module_password" id="target_module_password"
                       value="{{ module_pw_display if profile_to_edit else '' }}"
                       class="mt-1 block w-full px-3 py-2 bg-input-bg border-border-color text-text-primary rounded-md shadow-sm focus:border-purple-500 focus:ring-1 focus:ring-purple-500 sm:text-sm"
                       placeholder="{{ _('Optional register password for module') }}">
            </div>
            
            <div class="flex items-center">
                <input id="is_active" name="is_active" type="checkbox" value="true"
                       {% if profile_to_edit and profile_to_edit.is_active %}checked{% elif not profile_to_edit %}checked{% endif %}
                       class="h-4 w-4 text-purple-500 border-gray-500 rounded focus:ring-purple-500">
                <label for="is_active" class="ml-2 block text-sm text-text-primary">
                    {{ _('Is Active?') }}
                </label>
            </div>
        </div>

        <div class="mt-8">
            <button type="submit"
                    class="w-full px-4 py-2.5 text-sm font-medium text-dark-bg bg-purple-500 border border-purple-500 rounded-md hover:bg-purple-600 hover:border-purple-600 hover:shadow-lg hover:shadow-purple-500/40 transition-all duration-200">
                {% if profile_to_edit %}{{ _('Update Profile') }}{% else %}{{ _('Add Profile') }}{% endif %}
            </button>
        </div>
    </form>
</div>
{% endblock %}
