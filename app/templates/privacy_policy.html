{% extends "base.html" %}

{% block title %}{{ _('Privacy Policy') }}{% endblock %}

{% block head_extra_styles %}
<style nonce="{{ request.state.csp_nonce }}">
    .prose h1 {
        font-size: 1.875rem; 
        line-height: 2.25rem;
        font-weight: 700;
        margin-bottom: 1rem;
        color: #00c6ff; 
    }
    .prose h2 {
        font-size: 1.5rem; 
        line-height: 2rem;
        font-weight: 600;
        margin-top: 2rem;
        margin-bottom: 0.75rem;
        color: #FFF01F; 
        border-bottom: 1px solid #30363d; 
        padding-bottom: 0.25rem;
    }
    .prose h3 {
        font-size: 1.25rem;
        line-height: 1.75rem;
        font-weight: 600;
        margin-top: 1.5rem;
        margin-bottom: 0.5rem;
        color: #ff00ff; 
    }
    .prose p {
        margin-bottom: 1rem;
        line-height: 1.625; 
    }
    .prose ul {
        list-style-type: disc;
        list-style-position: inside;
        margin-bottom: 1rem;
        padding-left: 1rem;
    }
    .prose li {
        margin-bottom: 0.25rem;
    }
    .prose strong {
        color: #c9d1d9; 
        font-weight: 600;
    }
    .prose a {
        color: #00c6ff;
        text-decoration: underline;
    }
    .prose a:hover {
        opacity: 0.8;
    }
    .prose code {
        background-color: #0d1117; 
        color: #ff00ff; 
        padding: 0.25rem 0.5rem;
        border-radius: 0.25rem;
        font-size: 0.875rem;
    }
</style>
{% endblock %}


{% block content %}
<div class="max-w-4xl mx-auto bg-card-bg p-6 md:p-8 rounded-lg shadow-xl border border-border-color">
    <div class="prose prose-invert max-w-none">
        {# The policy_html variable is passed from the backend after being converted from Markdown #}
        {{ policy_html | safe }}
    </div>
</div>
{% endblock %}
