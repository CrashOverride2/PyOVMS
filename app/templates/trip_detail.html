{% extends "base.html" %}

{% block title %}{{ _(page_title) }}{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto" x-data="tripDetailData">
    <div class="flex justify-start mb-6">
        <a :href="backUrl" class="px-4 py-2 text-sm font-medium text-neon-blue border border-neon-blue rounded-md hover:bg-neon-blue hover:text-dark-bg transition-colors duration-200" x-text="backText"></a>
    </div>
    
    <div x-show="isLoading" class="text-center py-10 text-text-secondary">{{ _('Loading trip details...') }}</div>
    <div x-show="showError" class="p-4 text-center text-red-400 bg-red-900/40 border border-red-700/60 rounded-md">
        <p x-text="error"></p>
    </div>

    <template x-if="hasTrip">
        <div x-cloak>
            <div class="bg-card-bg p-6 rounded-lg shadow-xl border border-neon-blue/50">
                <h1 class="text-2xl md:text-3xl font-bold mb-4 text-neon-blue">{{ _('Trip Details') }}</h1>
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2">
                        <div id="trip-map"
                        class="h-[500px] relative z-0 rounded-md border border-border-color bg-gray-700"
                        :class="mapBlurClass"></div>
                    </div>
                    <div class="bg-input-bg p-5 rounded-md border border-border-color shadow-md">
                        <h2 class="text-xl font-semibold text-neon-yellow mb-3">{{ _('Summary') }}</h2>
                        <dl class="text-sm space-y-2">
                            <div class="flex justify-between"><dt class="text-text-secondary">{{ _('Start Time') }}</dt><dd class="text-text-primary text-right" x-text="tripView.startTimeText"></dd></div>
                            <div class="flex justify-between"><dt class="text-text-secondary">{{ _('End Time') }}</dt><dd class="text-text-primary text-right" x-text="tripView.endTimeText"></dd></div>
                            <div class="flex justify-between"><dt class="text-text-secondary">{{ _('Duration') }}</dt><dd class="text-text-primary font-medium" x-text="tripView.durationText"></dd></div>
                            <div class="flex justify-between"><dt class="text-text-secondary">{{ _('Distance') }}</dt><dd class="text-text-primary font-medium" x-text="tripView.distanceText"></dd></div>
                            <div class="flex justify-between"><dt class="text-text-secondary">{{ _('Avg. Speed') }}</dt><dd class="text-text-primary font-medium" x-text="tripView.averageSpeedText"></dd></div>
                            <div class="flex justify-between pt-2 border-t border-border-color/30"><dt class="text-text-secondary">{{ _('Start SOC') }}</dt><dd class="text-text-primary font-medium" x-text="tripView.startSocText"></dd></div>
                            <div class="flex justify-between"><dt class="text-text-secondary">{{ _('End SOC') }}</dt><dd class="text-text-primary font-medium" x-text="tripView.endSocText"></dd></div>
                            <div class="flex justify-between"><dt class="text-text-secondary">{{ _('SOC Used') }}</dt><dd class="font-medium" :class="tripView.socUsedClass" x-text="tripView.socUsedText"></dd></div>
                            <div class="flex justify-between"><dt class="text-text-secondary">{{ _('Energy Used') }}</dt><dd class="text-text-primary font-medium" x-text="tripView.energyUsedText"></dd></div>
                            <div class="flex justify-between"><dt class="text-text-secondary">{{ _('Avg. Consumption') }}</dt><dd class="text-text-primary font-medium" x-text="tripView.avgConsumptionText"></dd></div>
                        </dl>
                        <div class="mt-6 pt-4 border-t border-border-color/30 space-y-3">
                            <div class="flex space-x-3">
                                <a :href="tripView.gpxHref"
                                class="flex-1 text-center px-4 py-2 text-sm font-medium text-neon-green border border-neon-green rounded-md hover:bg-neon-green hover:text-dark-bg transition-colors">
                                    {{ _('Export GPX') }}
                                </a>
                                <a :href="tripView.kmlHref"
                                class="flex-1 text-center px-4 py-2 text-sm font-medium text-neon-yellow border border-neon-yellow rounded-md hover:bg-neon-yellow hover:text-dark-bg transition-colors">
                                    {{ _('Export KML') }}
                                </a>
                            </div>
                            <button @click="openDeleteConfirm" class="w-full px-4 py-2 text-sm font-medium text-red-500 border border-red-500 rounded-md hover:bg-red-500 hover:text-white transition-colors">
                                {{ _('Delete This Trip') }}
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template x-teleport="body">
        <div x-show="showDeleteConfirm" x-cloak
             class="fixed inset-0 z-[9999] flex items-center justify-center bg-black bg-opacity-75 backdrop-blur-sm"
             x-transition:enter="ease-out duration-300"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             x-transition:leave="ease-in duration-200"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0">
            <div @click.away="closeDeleteConfirm"
                 class="relative z-[10000] bg-card-bg rounded-lg shadow-xl border border-red-500/50 p-6 w-full max-w-md mx-4"
                 x-transition:enter="ease-out duration-300"
                 x-transition:enter-start="opacity-0 scale-95"
                 x-transition:enter-end="opacity-100 scale-100"
                 x-transition:leave="ease-in duration-200"
                 x-transition:leave-start="opacity-100 scale-100"
                 x-transition:leave-end="opacity-0 scale-95">
                
                <h3 class="text-xl font-bold text-red-400 mb-4">{{ _('Confirm Deletion') }}</h3>
                <p class="text-text-primary mb-6">{{ _('Are you sure you want to permanently delete this trip? This action cannot be undone.') }}</p>
                
                <div class="flex justify-end space-x-4">
                    <button @click="closeDeleteConfirm" class="px-4 py-2 text-sm font-medium text-text-secondary border border-border-color rounded-md hover:bg-border-color hover:text-text-primary transition-colors">
                        {{ _('Cancel') }}
                    </button>
                    <button @click="confirmDeleteTrip" class="px-4 py-2 text-sm font-medium text-dark-bg bg-red-600 border border-red-500 rounded-md hover:bg-red-700 transition-colors">
                        {{ _('Yes, Delete Trip') }}
                    </button>
                </div>
            </div>
        </div>
    </template>
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
<script nonce="{{ request.state.csp_nonce }}">
const KM_TO_MI = 0.621371;
const tripDetailConfig = {
    vehicleId: {{ vehicle.vehicle_id | tojson | safe }},
    tripId: {{ trip_id | tojson | safe }},
    userTimezone: {{ user_timezone | tojson | safe }},
    userPrefersImperial: {{ user_prefers_imperial | lower }},
    tripsBackUrl: {{ (url_for('ui_vehicle_detail_page', vehicle_module_id=vehicle.vehicle_id) ~ '?tab=trips') | tojson | safe }},
    searchBackUrl: {{ (url_for('ui_vehicle_detail_page', vehicle_module_id=vehicle.vehicle_id) ~ '?tab=search') | tojson | safe }},
    tripsBackText: {{ ('← ' + _('Back to All Trips')) | tojson | safe }},
    searchBackText: {{ ('← ' + _('Back to Search')) | tojson | safe }},
    tripDeletedRedirect: {{ (url_for('ui_vehicle_detail_page', vehicle_module_id=vehicle.vehicle_id) ~ '?tab=trips&success_message=' ~ _('Trip deleted successfully.')) | tojson | safe }}
};
document.addEventListener('alpine:init', () => {
    Alpine.data('tripDetailData', () => ({
        vehicleId: tripDetailConfig.vehicleId,
        tripId: tripDetailConfig.tripId,
        trip: null,
        hasTrip: false,
        isLoading: true,
        error: null,
        showError: false,
        map: null,
        userTimezone: tripDetailConfig.userTimezone,
        showDeleteConfirm: false,
        mapBlurClass: '',
        backUrl: tripDetailConfig.tripsBackUrl,
        backText: tripDetailConfig.tripsBackText,
        tripView: {
            startTimeText: 'N/A',
            endTimeText: 'N/A',
            durationText: 'N/A',
            distanceText: 'N/A',
            averageSpeedText: 'N/A',
            startSocText: 'N/A',
            endSocText: 'N/A',
            socUsedText: 'N/A',
            socUsedClass: 'text-text-primary',
            energyUsedText: 'N/A',
            avgConsumptionText: 'N/A',
            gpxHref: '#',
            kmlHref: '#'
        },

        init() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('from') === 'search') {
                this.backUrl = tripDetailConfig.searchBackUrl;
                this.backText = tripDetailConfig.searchBackText;
            }
            this.refreshUiState();
            this.fetchTripDetails();
        },
        refreshUiState() {
            this.showError = !!this.error;
            this.hasTrip = !!this.trip;
            this.mapBlurClass = this.showDeleteConfirm ? 'blur-sm pointer-events-none' : '';
        },
        buildTripView() {
            if (!this.trip) return;
            const tripId = this.trip.id;
            this.tripView.startTimeText = this.formatDateTime(this.trip.start_time);
            this.tripView.endTimeText = this.formatDateTime(this.trip.end_time);
            this.tripView.durationText = this.formatDuration(this.trip.duration_seconds);
            this.tripView.distanceText = this.formatDistance(this.trip.distance_km);
            this.tripView.averageSpeedText = this.formatSpeed(this.trip.average_speed_kph);
            this.tripView.startSocText = this.formatSoc(this.trip.start_soc);
            this.tripView.endSocText = this.formatSoc(this.trip.end_soc);
            this.tripView.socUsedText = this.formatSoc(this.trip.soc_used);
            this.tripView.socUsedClass = this.getSocColor(this.trip.soc_used);
            this.tripView.energyUsedText = this.trip.energy_used_kwh != null
                ? `${this.trip.energy_used_kwh.toFixed(2)} kWh` : 'N/A';
            if (tripDetailConfig.userPrefersImperial) {
                this.tripView.avgConsumptionText = this.trip.consumption_kwh_per_100mi != null
                    ? `${this.trip.consumption_kwh_per_100mi.toFixed(1)} kWh/100 mi` : 'N/A';
            } else {
                this.tripView.avgConsumptionText = this.trip.consumption_kwh_per_100km != null
                    ? `${this.trip.consumption_kwh_per_100km.toFixed(1)} kWh/100 km` : 'N/A';
            }
            this.tripView.gpxHref = `/api/karto/v1/trips/${tripId}/gpx`;
            this.tripView.kmlHref = `/api/karto/v1/trips/${tripId}/kml`;
        },
        openDeleteConfirm() { this.showDeleteConfirm = true; this.refreshUiState(); },
        closeDeleteConfirm() { this.showDeleteConfirm = false; this.refreshUiState(); },
        confirmDeleteTrip() {
            if (!this.trip || !this.trip.id) return;
            const id = this.trip.id;
            this.closeDeleteConfirm();
            this.deleteTrip(id);
        },

        fetchTripDetails() {
            this.isLoading = true;
            this.error = null;
            this.refreshUiState();
            fetch(`/api/karto/v1/trips/${this.tripId}`, { credentials: 'include' })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => { throw new Error(err.detail || `{{ _('Failed to load trip details (Status: ') }}${response.status})`); });
                    }
                    return response.json();
                })
                .then(data => {
                    this.trip = data;
                    this.buildTripView();
                    this.refreshUiState();
                    this.$nextTick(() => this.initMap());
                })
                .catch(err => {
                    this.error = err.message;
                    this.refreshUiState();
                    console.error('Fetch error:', err);
                })
                .finally(() => this.isLoading = false);
        },

        initMap(attempt = 0) {
            if (typeof L === 'undefined' || !this.trip || !this.trip.geojson) {
                document.getElementById('trip-map').innerHTML = `<div class="flex items-center justify-center h-full text-text-secondary">{{ _("Map data not available for this trip.") }}</div>`;
                return;
            }

            const tripMapEl = document.getElementById('trip-map');
            if (!tripMapEl) return;

            // $nextTick fires before the browser layout pass; defer until the container
            // has actual dimensions so Leaflet/Protomaps initializes with the right size.
            if (tripMapEl.offsetWidth === 0 && attempt < 30) {
                requestAnimationFrame(() => this.initMap(attempt + 1));
                return;
            }

            if (this.map) this.map.remove();
            this.map = L.map('trip-map');
            
            const protomapsUrl = {{ PROTOMAPS_URL | tojson | safe }};

            if (protomapsUrl) {
                if (typeof protomapsL === 'undefined' || (protomapsUrl.endsWith('.pmtiles') && typeof pmtiles === 'undefined')) {
                    console.error('Protomaps scripts (protomaps-leaflet.js and/or pmtiles.js) are not loaded.');
                    document.getElementById('trip-map').innerHTML = `<div class="flex items-center justify-center h-full text-red-400 p-4 text-center">{{ _("Map Error: Protomaps scripts failed to load. Check the browser console and server configuration.") }}</div>`;
                    return;
                }
                try {
                    const paintRules = [
                        { dataLayer: "water", symbolizer: new protomapsL.PolygonSymbolizer({ fill: "#1e3a8a" }) },
                        { dataLayer: "landuse", symbolizer: new protomapsL.PolygonSymbolizer({ fill: "#161b22" }) },
                        { dataLayer: "natural", symbolizer: new protomapsL.PolygonSymbolizer({ fill: "#161b22" }) },
                        { dataLayer: "transit", symbolizer: new protomapsL.LineSymbolizer({ color: "#374151", width: 1 })},
                        {
                            dataLayer: "roads",
                            symbolizer: new protomapsL.LineSymbolizer({
                                color: (z,f) => (f.props.highway_kind === "highway" || f.props.highway_kind === "motorway") ? "#6b7280" : "#4b5563",
                                width: (z,f) => (f.props.highway_kind === "highway" || f.props.highway_kind === "motorway") ? (z > 14 ? 3 : 2) : (z > 14 ? 2 : 1)
                            })
                        },
                        { dataLayer: "buildings", symbolizer: new protomapsL.PolygonSymbolizer({ fill: "#22282f" }) },
                        { dataLayer: "boundaries", symbolizer: new protomapsL.LineSymbolizer({ color: "#39FF14", width: 0.5, opacity: 0.4 }) }
                    ];

                    const labelRules = [
                        {
                            dataLayer: "places",
                            symbolizer: new protomapsL.CenteredTextSymbolizer({
                                label_props: ["name:{{ user_locale }}","name"],
                                fill: (z,f) => (f.props.kind === 'country' || f.props.kind === 'region') ? '#FFF01F' : '#c9d1d9',
                                stroke: "#0d1117",
                                width: 2,
                                font: (z,f) => {
                                    if (f.props.kind === 'country') return "bold 14px RobotoMono, monospace";
                                    if (f.props.kind === 'region') return "bold 12px RobotoMono, monospace";
                                    return "11px RobotoMono, monospace";
                                }
                            })
                        },
                        {
                            dataLayer: "roads",
                            symbolizer: new protomapsL.LineLabelSymbolizer({
                                label_props: ["name:{{ user_locale }}","name"],
                                fill: "#8b949e",
                                stroke: "#0d1117",
                                width: 2,
                                font: "10px RobotoMono, monospace"
                            })
                        },
                        { dataLayer: "water", symbolizer: new protomapsL.CenteredTextSymbolizer({ label_props: ["name"], fill: "#00c6ff", stroke: "#0d1117", font: "italic 12px sans-serif" }) },
                        { dataLayer: "pois", symbolizer: new protomapsL.CenteredTextSymbolizer({ label_props: ["name"], fill: "#c9d1d9", stroke: "#0d1117", font: "10px sans-serif" }) }
                    ];
                    let mapUrl = protomapsUrl;
                    if (protomapsUrl.endsWith('.pmtiles') && typeof pmtiles !== 'undefined') {
                        const pmtilesSource = new pmtiles.FetchSource(protomapsUrl, new Headers({'Cache-Control': 'no-cache', 'Pragma': 'no-cache'}));
                        pmtilesSource.chromeWindowsNoCache = true;
                        mapUrl = new pmtiles.PMTiles(pmtilesSource);
                    }
                    protomapsL.leafletLayer({
                        url: mapUrl,
                        paintRules: paintRules,
                        labelRules: labelRules,
                        backgroundColor: "#0d1117"
                    }).addTo(this.map);
                } catch (e) {
                    console.error('Error initializing Protomaps layer:', e);
                    document.getElementById('trip-map').innerHTML = `<div class="flex items-center justify-center h-full text-red-400 p-4 text-center">{{ _("Map Error: Could not initialize Protomaps layer.") }}</div>`;
                }
            } else {
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors', maxZoom: 19
                }).addTo(this.map);
            }

            const geojsonData = JSON.parse(this.trip.geojson);
            const tripPath = L.geoJSON(geojsonData, { style: { color: "#39FF14", weight: 4, opacity: 0.8 } }).addTo(this.map);
            this.map.fitBounds(tripPath.getBounds().pad(0.1));
            if (this.tripMapResizeObserver) this.tripMapResizeObserver.disconnect();
            this.tripMapResizeObserver = new ResizeObserver(() => { if (this.map) this.map.invalidateSize({ pan: false }); });
            this.tripMapResizeObserver.observe(tripMapEl);
            requestAnimationFrame(() => { if (this.map) this.map.invalidateSize({ pan: false }); });
            setTimeout(() => { if (this.map) this.map.invalidateSize({ pan: false }); }, 500);

            const startCoordGeoJSON = geojsonData.coordinates[0];
            const endCoordGeoJSON = geojsonData.coordinates[geojsonData.coordinates.length - 1];

            L.marker([startCoordGeoJSON[1], startCoordGeoJSON[0]], { icon: L.divIcon({ className: 'text-2xl', html: '🟢' }) }).addTo(this.map).bindPopup("{{ _('Trip Start') }}");
            L.marker([endCoordGeoJSON[1], endCoordGeoJSON[0]], { icon: L.divIcon({ className: 'text-2xl', html: '🏁' }) }).addTo(this.map).bindPopup("{{ _('Trip End') }}");
        },

        deleteTrip(id) {
            fetch(`/api/karto/v1/trips/${id}`, { method: 'DELETE', credentials: 'include' })
                .then(response => {
                    if (response.ok) {
                        window.location.href = tripDetailConfig.tripDeletedRedirect;
                    } else {
                        response.json().then(data => alert(`{{ _('Error deleting trip: ') }}${data.detail || response.statusText}`));
                    }
                })
                .catch(err => alert(`{{ _('Network error: ') }}${err.message}`));
        },
        
        formatDateTime(isoString) {
            if (!isoString) return 'N/A';
            const date = new Date(isoString);
            try {
                return date.toLocaleString(undefined, { 
                    timeZone: this.userTimezone,
                    dateStyle: 'medium', 
                    timeStyle: 'short' 
                });
            } catch(e) {
                console.error(`Invalid timezone for formatting: ${this.userTimezone}`, e);
                return date.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
            }
        },
        formatDuration(seconds) {
            if (seconds === null || seconds === undefined) return 'N/A';
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            return [h, m, s].map(v => v < 10 ? '0' + v : v).join(':');
        },
        formatDistance(km) {
            if (km === null || km === undefined) return 'N/A';
            if (tripDetailConfig.userPrefersImperial) return `${(km * KM_TO_MI).toFixed(2)} mi`;
            return `${km.toFixed(2)} km`;
        },
        formatSpeed(kph) {
            if (kph === null || kph === undefined) return 'N/A';
            if (tripDetailConfig.userPrefersImperial) return `${(kph * KM_TO_MI).toFixed(1)} mph`;
            return `${kph.toFixed(1)} kph`;
        },
        formatSoc(soc) { return soc !== null ? `${soc.toFixed(1)} %` : 'N/A'; },
        getSocColor(soc) { return soc > 0 ? 'text-red-400' : (soc < 0 ? 'text-green-400' : 'text-text-primary'); },
        getStatusColor(status) {
            if (status === 'completed') return 'bg-green-700/70 text-green-300';
            if (status === 'timeout') return 'bg-yellow-700/70 text-yellow-300';
            return 'bg-blue-700/70 text-blue-300';
        }
    }));
});
</script>
{% endblock %}
