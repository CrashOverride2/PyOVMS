{% extends "base.html" %}

{% block title %}{{ _(page_title) }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-card-bg p-8 rounded-lg shadow-xl border border-neon-green/50 mt-12">
    <div class="text-center">
        <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-neon-green/20 mb-6">
            <svg class="h-8 w-8 text-neon-green" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
        </div>
        <h1 class="text-2xl font-bold mb-4 text-neon-green">{{ _('Password Reset Successful') }}</h1>
        <p class="text-text-secondary mb-8">
            {{ _('Your password has been successfully reset. You can now log in with your new password.') }}
        </p>
        <a href="{{ url_for('ui_login_form') }}"
           class="inline-block px-6 py-2.5 text-sm font-medium text-dark-bg bg-neon-blue border border-neon-blue rounded-md hover:bg-neon-blue-darker hover:border-neon-blue-darker hover:shadow-lg hover:shadow-neon-blue/40 transition-all duration-200">
            {{ _('Go to Login') }}
        </a>
    </div>
</div>
{% endblock %}
